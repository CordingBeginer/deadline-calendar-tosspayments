<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>결제 처리 - 마감일 캘린더</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: "Pretendard", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #f5f6f8;
    margin: 0;
    padding: 24px;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    color: #191f28;
  }
  .wrap { width: 100%; max-width: 460px; }
  .card {
    background: #fff;
    border-radius: 20px;
    padding: 32px 24px;
    box-shadow: 0 4px 24px rgba(0,0,0,0.06);
    border: 1px solid #f0f2f5;
    text-align: center;
  }
  .icon-wrap {
    width: 60px; height: 60px;
    margin: 0 auto 18px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 28px;
  }
  .icon-loading { background: #f2f7ff; color: #0064ff; animation: pulse 1.2s infinite; }
  .icon-success { background: #e8f8ee; color: #1a9e52; }
  .icon-va { background: #fff8e6; color: #f59e0b; }
  .icon-fail { background: #fff0ef; color: #e11d48; }

  @keyframes pulse {
    0%, 100% { transform: scale(1); opacity: 1; }
    50% { transform: scale(1.08); opacity: 0.7; }
  }

  h1 { font-size: 22px; font-weight: 800; margin: 0 0 8px; }
  p.sub { font-size: 14px; color: #8b95a1; margin: 0 0 24px; line-height: 1.5; }

  .receipt-box {
    background: #f9fafb;
    border-radius: 14px;
    padding: 18px 20px;
    text-align: left;
    margin-bottom: 24px;
    border: 1px solid #e5e8eb;
  }
  .receipt-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 0;
    font-size: 13.5px;
    border-bottom: 1px solid #f2f4f6;
  }
  .receipt-row:last-child { border-bottom: none; }
  .receipt-label { color: #8b95a1; font-weight: 500; }
  .receipt-val { color: #333d4b; font-weight: 700; word-break: break-all; text-align: right; }
  .receipt-val.highlight { color: #0064ff; font-size: 16px; }

  .va-account-highlight {
    background: #eff6ff;
    border: 1.5px solid #bfdbfe;
    border-radius: 14px;
    padding: 18px;
    margin-bottom: 20px;
    text-align: left;
  }
  .va-title { font-size: 12px; font-weight: 700; color: #1e40af; margin-bottom: 6px; }
  .va-num-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .va-num { font-size: 20px; font-weight: 800; color: #1e3a8a; letter-spacing: 0.5px; }
  .btn-copy {
    background: #0064ff;
    color: #fff;
    border: none;
    padding: 7px 14px;
    border-radius: 8px;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
    white-space: nowrap;
  }
  .btn-copy:hover { background: #0052cc; }

  .btn-primary {
    width: 100%;
    padding: 15px;
    background: #0064ff;
    color: #fff;
    border: none;
    border-radius: 12px;
    font-size: 15.5px;
    font-weight: 700;
    cursor: pointer;
    text-decoration: none;
    display: inline-block;
    transition: background 0.15s ease;
  }
  .btn-primary:hover { background: #0052cc; }

  .btn-simulate {
    width: 100%;
    padding: 12px;
    background: #fff;
    color: #f59e0b;
    border: 1.5px solid #f59e0b;
    border-radius: 12px;
    font-size: 13.5px;
    font-weight: 700;
    cursor: pointer;
    margin-top: 10px;
    transition: all 0.15s ease;
  }
  .btn-simulate:hover { background: #fffbeb; }

  .simulate-badge {
    display: inline-block;
    background: #fef3c7;
    color: #92400e;
    font-size: 11px;
    padding: 3px 8px;
    border-radius: 6px;
    font-weight: 700;
    margin-top: 10px;
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="card" id="card-content">
    <div class="icon-wrap icon-loading" id="status-icon">⏳</div>
    <h1 id="status-title">결제 승인 처리 중</h1>
    <p class="sub" id="status-sub">토스페이먼츠 보안 서버와 통신하고 있습니다.<br/>창을 닫지 마세요.</p>

    <div id="receipt-area" style="display: none;"></div>
    <div id="action-area" style="display: none;"></div>
  </div>
</div>

<script>
  const urlParams = new URLSearchParams(window.location.search);
  const paymentKey = urlParams.get("paymentKey");
  const orderId = urlParams.get("orderId");
  const amount = urlParams.get("amount");

  const cardContent = document.getElementById("card-content");
  const statusIcon = document.getElementById("status-icon");
  const statusTitle = document.getElementById("status-title");
  const statusSub = document.getElementById("status-sub");
  const receiptArea = document.getElementById("receipt-area");
  const actionArea = document.getElementById("action-area");

  async function confirmPayment() {
    if (!paymentKey || !orderId || !amount) {
      renderError("결제 정보가 올바르지 않습니다. (필수 파라미터 누락)");
      return;
    }

    try {
      const res = await fetch("/api/payments/confirm", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ paymentKey, orderId, amount: Number(amount) }),
      });

      const result = await res.json();

      if (!res.ok) {
        renderError(result.message || result.error || "결제 승인에 실패했습니다.");
        return;
      }

      // 프리미엄 결제 성공 상태를 localStorage에 영구 기록
      localStorage.setItem("user_tier", "PREMIUM");
      localStorage.setItem("user_order_id", orderId);

      // 부모 창(workspace-mockup-everytime)에 결제 성공 메시지 전달
      if (window.opener && !window.opener.closed) {
        try {
          window.opener.postMessage({ type: "PAYMENT_COMPLETE", orderId, status: result.status }, "*");
        } catch (e) {}
      }

      // 가상계좌(WAITING_FOR_DEPOSIT) 또는 일반 완료(DONE) 분기
      if (result.method === "가상계좌" || result.status === "WAITING_FOR_DEPOSIT") {
        renderVirtualAccount(result);
      } else {
        renderCardSuccess(result);
      }
    } catch (err) {
      console.error(err);
      renderError("서버와의 통신 중 네트워크 오류가 발생했습니다.");
    }
  }

  // 1) 가상계좌 발급 완료 화면
  function renderVirtualAccount(data) {
    const va = data.virtualAccount || {};
    const bankName = va.bank || va.bankCode || "가상계좌";
    const accountNum = va.accountNumber || "계좌번호 생성됨";
    const holder = va.customerName || "학생(본인)";
    const dueDate = va.dueDate ? new Date(va.dueDate).toLocaleString("ko-KR") : "발급 후 72시간 이내";

    statusIcon.className = "icon-wrap icon-va";
    statusIcon.textContent = "🏦";
    statusTitle.textContent = "가상계좌가 발급되었습니다";
    statusSub.textContent = "아래 계좌로 입금하시면 프리미엄 플랜이 즉시 활성화됩니다.";

    receiptArea.style.display = "block";
    receiptArea.innerHTML = `
      <div class="va-account-highlight">
        <div class="va-title">입금 전용 가상계좌 (${bankName})</div>
        <div class="va-num-row">
          <span class="va-num" id="acc-num">${accountNum}</span>
          <button class="btn-copy" onclick="copyAccount('${accountNum}')">복사</button>
        </div>
      </div>
      <div class="receipt-box">
        <div class="receipt-row">
          <span class="receipt-label">예금주</span>
          <span class="receipt-val">${holder}</span>
        </div>
        <div class="receipt-row">
          <span class="receipt-label">입금 금액</span>
          <span class="receipt-val highlight">${Number(data.totalAmount || amount).toLocaleString()}원</span>
        </div>
        <div class="receipt-row">
          <span class="receipt-label">입금 마감 기한</span>
          <span class="receipt-val">${dueDate}</span>
        </div>
        <div class="receipt-row">
          <span class="receipt-label">주문 번호</span>
          <span class="receipt-val">${orderId}</span>
        </div>
      </div>
    `;

    actionArea.style.display = "block";
    actionArea.innerHTML = `
      <a href="/?premium=true" class="btn-primary">마감일 캘린더 작업 화면으로 가기</a>
      <button class="btn-simulate" onclick="simulateDeposit('${orderId}')">
        ⚡ [교수님 시연용] 모의 입금 완료 처리하기
      </button>
      <div class="simulate-badge">데모 시연 시 버튼을 누르면 즉시 입금 완료 상태로 전환됩니다.</div>
    `;
  }

  // 2) 카드/계좌이체 결제 완료 화면
  function renderCardSuccess(data) {
    statusIcon.className = "icon-wrap icon-success";
    statusIcon.textContent = "✓";
    statusTitle.textContent = "결제가 완료되었습니다!";
    statusSub.textContent = "프리미엄 혜택이 정상적으로 적용되었습니다.";

    receiptArea.style.display = "block";
    receiptArea.innerHTML = `
      <div class="receipt-box">
        <div class="receipt-row">
          <span class="receipt-label">상품명</span>
          <span class="receipt-val">${data.orderName || "프리미엄 플랜 (1학기)"}</span>
        </div>
        <div class="receipt-row">
          <span class="receipt-label">결제 금액</span>
          <span class="receipt-val highlight">${Number(data.totalAmount || amount).toLocaleString()}원</span>
        </div>
        <div class="receipt-row">
          <span class="receipt-label">결제 수단</span>
          <span class="receipt-val">${data.method || "카드"}</span>
        </div>
        <div class="receipt-row">
          <span class="receipt-label">주문 번호</span>
          <span class="receipt-val">${orderId}</span>
        </div>
      </div>
    `;

    actionArea.style.display = "block";
    actionArea.innerHTML = `
      <a href="/?premium=true" class="btn-primary">마감일 캘린더 작업 화면으로 가기</a>
    `;
  }

  // 3) 실패 화면
  function renderError(msg) {
    statusIcon.className = "icon-wrap icon-fail";
    statusIcon.textContent = "✕";
    statusTitle.textContent = "결제 승인 실패";
    statusSub.textContent = msg;

    receiptArea.style.display = "none";
    actionArea.style.display = "block";
    actionArea.innerHTML = `
      <a href="/checkout-popup.html" class="btn-primary">다시 결제하기</a>
      <p style="margin-top: 14px;"><a href="/" style="color: #8b95a1; font-size: 13px; text-decoration: none;">메인 화면으로 돌아가기</a></p>
    `;
  }

  // 계좌번호 복사 함수
  window.copyAccount = function(text) {
    navigator.clipboard.writeText(text).then(() => {
      alert("가상계좌 번호가 복사되었습니다: " + text);
    }).catch(() => {
      prompt("계좌번호를 복사하세요:", text);
    });
  };

  // 모의 입금 시뮬레이션
  window.simulateDeposit = async function(oId) {
    try {
      const res = await fetch("/api/simulate-deposit", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ orderId: oId }),
      });
      const data = await res.json();
      if (data.ok) {
        alert("🎉 [시연용] 가상계좌 입금이 성공적으로 확인되었습니다!\n프리미엄이 활성화됩니다.");
        window.location.href = "/?premium=true";
      }
    } catch (e) {
      alert("모의 입금 실패: " + e.message);
    }
  };

  confirmPayment();
</script>
</body>
</html>
